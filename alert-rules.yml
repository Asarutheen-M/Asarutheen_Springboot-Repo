groups:
  - name: hdfc-app-alerts
    rules:
      - alert: AppPodDown
        expr: up{job="hdfc-app"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "HDFC_APP pod {{ $labels.instance }} is down"
      - alert: HighCpu
        expr: rate(process_cpu_usage[5m]) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
